name: Conduit CI and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conduit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Modules and format
        run: |
          go mod verify
          go mod tidy -diff
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Public history hygiene
        run: |
          git init "$RUNNER_TEMP/hygiene"
          git -C "$RUNNER_TEMP/hygiene" fetch --depth=1 https://github.com/hollis-labs/tools.git ff31a569e895710bafd91666300be1054ea68449
          git -C "$RUNNER_TEMP/hygiene" checkout --detach FETCH_HEAD
          python3 "$RUNNER_TEMP/hygiene/scripts/scan-public" --repo "$GITHUB_WORKSPACE" --ref HEAD
      - name: Vet
        run: go vet ./...
      - name: Caster integration binary
        run: |
          mkdir -p "$RUNNER_TEMP/tools-bin"
          GOBIN="$RUNNER_TEMP/tools-bin" go install github.com/hollis-labs/tools/caster/cmd/caster@1834ce0f81fc9f11eed7709889cc3f567c623d65
          echo "$RUNNER_TEMP/tools-bin" >> "$GITHUB_PATH"
      - name: Race tests
        run: go test -race -count=1 -timeout=8m ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: .
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: .
          args: --config .golangci.transport.yml
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  artifact:
    needs: check
    uses: hollis-labs/substrate/.github/workflows/go-app-build.yml@f516516ec6d1767daab29bc162781f294c2bc981
    with:
      app: conduit
      main_pkg: ./cmd/conduit
      build_runner: '"ubuntu-latest"'
      version: v0.0.0-ci.${{ github.run_number }}
      targets: '["linux/amd64"]'
      # Full race/lint/integration checks already passed in the required check job.
      test_cmd: go build ./...
      ldflags_var: ''
      extra_files: deploy.yaml
      migrations_glob: internal/persistence/migrations/sqlite/*.sql
